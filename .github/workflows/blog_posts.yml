# Refreshes the "Latest blog posts" section of both profile READMEs from the Medium RSS feed.
# See https://github.com/gautamkrishnar/blog-post-workflow
name: Blog posts
on:
  # Daily at 06:00 UTC
  schedule: [{cron: "0 6 * * *"}]
  workflow_dispatch:
# Never let two runs push README changes at the same time
concurrency:
  group: blog-posts
  cancel-in-progress: false
jobs:
  update-blog-posts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gautamkrishnar/blog-post-workflow@f177491c77670f150ab4e9b9890254d8eba4164b # 1.9.7
        with:
          feed_list: https://medium.com/feed/@tyutyutyu
          readme_path: ./README.md,./README.hu.md
          max_post_count: 3
          commit_message: "chore: update latest blog posts"
